<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Little by little — To-do</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head>
<body><main><header><span class="brand"><b aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 19 19 5M6 5h13v13"/></svg></b> LITTLE BY LITTLE</span></header>
<section class="intro"><h1>Small steps. <em>Clear mind.</em></h1><span class="hero-flower" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M24 3v42M3 24h42M9 9l30 30M9 39 39 9"/></svg></span></section>

<p class="sr" id="status" role="status" aria-live="polite" aria-atomic="true"></p></main></body></html>
